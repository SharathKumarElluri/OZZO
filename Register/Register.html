
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account | OZZO</title>

    <link
        rel="icon"
        type="image/png"
        href="/OZZO logo.png"
    >

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <!-- Google Fonts -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- Register CSS -->
    <link
        rel="stylesheet"
        href="Register.css"
    >

</head>


<body>

<main class="register-page">


    <!-- =========================================
         LOGO
    ========================================== -->

    <div class="logo-wrap">

        <a
            href="index.html"
            class="ozzo-logo"
            aria-label="OZZO Home"
        >
            OZZO
        </a>

    </div>


    <!-- =========================================
         REGISTER CARD
    ========================================== -->

    <section
        class="register-card"
        aria-labelledby="registerTitle"
    >


        <!-- =====================================
             HEADER
        ====================================== -->

        <div class="register-header">

            <h1 id="registerTitle">
                Create account
            </h1>

            <p>
                Join OZZO and make every day easier.
            </p>

        </div>


        <!-- =====================================
             REGISTER FORM
        ====================================== -->

        <form
            id="registerForm"
            novalidate
        >


            <!-- =================================
                 NAME
            ================================== -->

            <div class="form-group">

                <label for="fullName">
                    Your name
                    <span
                        class="required-star"
                        aria-hidden="true"
                    >*</span>
                </label>

                <input
                    type="text"
                    id="fullName"
                    name="fullName"
                    placeholder="Enter your full name"
                    autocomplete="name"
                    maxlength="60"
                    required
                >

                <small
                    id="nameError"
                    class="error-text"
                    aria-live="polite"
                ></small>

            </div>


            <!-- =================================
                 MOBILE
            ================================== -->

            <div class="form-group">

                <label for="mobile">
                    Mobile number
                    <span
                        class="required-star"
                        aria-hidden="true"
                    >*</span>
                </label>

                <div class="mobile-input">

                    <span class="country-code">
                        +91
                    </span>

                    <input
                        type="tel"
                        id="mobile"
                        name="mobile"
                        placeholder="Enter 10-digit mobile number"
                        autocomplete="tel"
                        maxlength="10"
                        inputmode="numeric"
                        required
                    >

                </div>

                <small
                    id="mobileError"
                    class="error-text"
                    aria-live="polite"
                ></small>

            </div>


            <!-- =================================
                 EMAIL
            ================================== -->

            <div class="form-group">

                <label for="email">
                    Email
                    <span
                        class="required-star"
                        aria-hidden="true"
                    >*</span>
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email address"
                    autocomplete="email"
                    maxlength="100"
                    required
                >

                <small
                    id="emailError"
                    class="error-text"
                    aria-live="polite"
                ></small>

            </div>


            <!-- =================================
                 PASSWORD
            ================================== -->

            <div class="form-group">

                <label for="password">
                    Password
                    <span
                        class="required-star"
                        aria-hidden="true"
                    >*</span>
                </label>

                <div class="password-wrap">

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="At least 6 characters"
                        autocomplete="new-password"
                        maxlength="60"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        id="passwordToggle"
                        aria-label="Show password"
                        title="Show password"
                    >
                        <i class="fa-regular fa-eye"></i>
                    </button>

                </div>

                <small
                    id="passwordError"
                    class="error-text"
                    aria-live="polite"
                ></small>

            </div>


            <!-- =================================
                 CONFIRM PASSWORD
            ================================== -->

            <div class="form-group">

                <label for="confirmPassword">
                    Re-enter password
                    <span
                        class="required-star"
                        aria-hidden="true"
                    >*</span>
                </label>

                <div class="password-wrap">

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Re-enter your password"
                        autocomplete="new-password"
                        maxlength="60"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        id="confirmPasswordToggle"
                        aria-label="Show password"
                        title="Show password"
                    >
                        <i class="fa-regular fa-eye"></i>
                    </button>

                </div>

                <small
                    id="confirmPasswordError"
                    class="error-text"
                    aria-live="polite"
                ></small>

            </div>


            <!-- =================================
                 TERMS & PRIVACY
            ================================== -->

            <div class="terms-check">

                <label for="terms">

                    <input
                        type="checkbox"
                        id="terms"
                        name="terms"
                        required
                    >

                    <span
                        class="custom-check"
                        aria-hidden="true"
                    ></span>

                    <span class="terms-label">

                        I agree to OZZO's

                        <a href="Terms.html">
                            Terms of Use
                        </a>

                        and

                        <a href="Privacy.html">
                            Privacy Notice
                        </a>.

                        <span
                            class="required-star"
                            aria-hidden="true"
                        >*</span>

                    </span>

                </label>

                <small
                    id="termsError"
                    class="error-text"
                    aria-live="polite"
                ></small>

            </div>


            <!-- =================================
                 CREATE ACCOUNT BUTTON
            ================================== -->

            <button
                type="submit"
                class="create-btn"
                id="createAccountBtn"
            >

                <span>
                    Create your OZZO account
                </span>

                <i
                    class="fa-solid fa-arrow-right"
                    aria-hidden="true"
                ></i>

            </button>


            <!-- =================================
                 REGISTER MESSAGE
            ================================== -->

            <div
                id="registerMessage"
                class="register-message"
                aria-live="polite"
            ></div>


        </form>


        <!-- =====================================
             LOGIN DIVIDER
        ====================================== -->

        <div class="login-divider">

            <span>
                Already have an account?
            </span>

        </div>


        <!-- =====================================
             LOGIN LINK
        ====================================== -->

        <a
            href="/Login/Login.html"
            class="sign-in-link"
        >
            Sign in to your OZZO account
        </a>


    </section>


    <!-- =========================================
         FOOTER
    ========================================== -->

    <footer class="register-footer">

        <div class="footer-links">

            <a href="Terms.html">
                Terms of Use
            </a>

            <a href="Privacy.html">
                Privacy Notice
            </a>

            <a href="Contact/Contact.html">
                Help
            </a>

        </div>

        <p>
            © 2026 OZZO. All rights reserved.
        </p>

    </footer>


</main>


<!-- Register JavaScript -->
<script src="Register.js"></script>

</body>

</html>

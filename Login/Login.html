
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sign in | OZZO</title>

    <link rel="icon" type="image/png" href="/OZZO logo.png">

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- OZZO Login CSS -->
    <link rel="stylesheet" href="Login.css">
</head>

<body>

    <main class="login-page">

        <!-- =========================================
             LOGO
        ========================================== -->

        <div class="logo-wrap">
            <a href="index.html" class="ozzo-logo">
                OZZO
            </a>
        </div>


        <!-- =========================================
             LOGIN CARD
        ========================================== -->

        <section class="login-card">

            <div class="login-card-header">
                <h1>Sign in</h1>
                <p>Welcome back to OZZO.</p>
            </div>


            <!-- =====================================
                 LOGIN FORM
            ====================================== -->

            <form id="loginForm" novalidate>

                <!-- EMAIL -->
                <div class="form-group">

                    <label for="email">
                        Email or mobile phone number
                    </label>

                    <div class="input-wrap">

                        <input
                            type="text"
                            id="email"
                            name="email"
                            placeholder="Enter email or mobile number"
                            autocomplete="username"
                            required
                        >

                    </div>

                    <small
                        id="emailError"
                        class="error-text"
                    ></small>

                </div>


                <!-- CONTINUE -->
                <button
                    type="submit"
                    class="continue-btn"
                >
                    Continue
                </button>


                <!-- TERMS -->
                <p class="terms-text">
                    By continuing, you agree to OZZO's
                    <a href="Terms.html">
                        Terms of Use
                    </a>
                    and
                    <a href="Privacy.html">
                        Privacy Notice
                    </a>.
                </p>


                <!-- HELP -->
                <div class="help-area">

                    <button
                        type="button"
                        id="helpButton"
                        class="help-button"
                    >
                        <i class="fa-solid fa-angle-right"></i>
                        Need help?
                    </button>

                </div>


                <!-- MESSAGE -->
                <div
                    id="loginMessage"
                    class="login-message"
                    aria-live="polite"
                ></div>

            </form>


            <!-- =====================================
                 DIVIDER
            ====================================== -->

            <div class="divider">
                <span>New to OZZO?</span>
            </div>


            <!-- =====================================
                 CREATE ACCOUNT
            ====================================== -->

            <a
                href="/Register/Register.html"
                class="create-account-btn"
            >
                Create your OZZO account
            </a>

        </section>


        <!-- =========================================
             FOOTER
        ========================================== -->

        <footer class="login-footer">

            <div class="footer-links">

                <a href="Terms.html">
                    Terms of Use
                </a>

                <a href="Privacy.html">
                    Privacy Notice
                </a>

                <a href="Contact/Contact.html">
                    Help
                </a>

            </div>

            <p>
                © 2026 OZZO. All rights reserved.
            </p>

        </footer>

    </main>


    <script src="Login.js"></script>

</body>
</html>
